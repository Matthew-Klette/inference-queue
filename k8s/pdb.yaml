apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference-queue-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: inference-queue, app.kubernetes.io/component: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference-queue-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: inference-queue, app.kubernetes.io/component: worker }
