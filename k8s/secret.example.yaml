# Template only. Do not commit real values; create the Secret out of band, e.g.
#   kubectl create secret generic inference-queue \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=BOOTSTRAP_ADMIN_KEY="iq_$(openssl rand -hex 24)" \
#     --from-literal=WEBHOOK_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: inference-queue
  labels: { app.kubernetes.io/name: inference-queue }
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/iq?sslmode=require"
  REDIS_URL: "redis://HOST:6379/0"
  BOOTSTRAP_ADMIN_KEY: "iq_REPLACE_ME"
  WEBHOOK_SECRET: "REPLACE_ME"
  # MODEL_API_KEY: "only if the model server needs a bearer token"
