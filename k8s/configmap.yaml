apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-queue
  labels: { app.kubernetes.io/name: inference-queue }
data:
  LOG_LEVEL: "info"
  MODEL_BACKEND: "openai"
  # An OpenAI-compatible server inside the cluster (vLLM, llama.cpp server, ...).
  MODEL_BASE_URL: "http://vllm.models.svc.cluster.local:8000"
  MODEL_TIMEOUT: "120s"
  MODEL_RETRIES: "3"
  BREAKER_FAILURES: "5"
  BREAKER_COOLDOWN: "15s"
  WORKER_CONCURRENCY: "16"
  LEASE_DURATION: "60s"
  MAX_ATTEMPTS: "5"
  BACKOFF_BASE: "2s"
  BACKOFF_MAX: "5m"
  CACHE_TTL: "24h"
  SHUTDOWN_TIMEOUT: "30s"
